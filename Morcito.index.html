<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sonic Saga - Amir Nivel 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --sonic-blue: #0054FF;
            --sonic-dark: #002b80;
            --ring-gold: #FFD700;
        }

        body {
            margin: 0;
            background-color: #000;
            font-family: 'Bungee', cursive;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .game-background {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0080ff 0%, #00d4ff 40%, #5c940d 40%, #8b4513 100%);
            z-index: -1;
        }

        .console-container {
            width: 90%;
            max-width: 380px;
            background: #1a1a1a;
            padding: 8px;
            border-radius: 40px;
            border: 4px solid #333;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            /* Fix para iOS shadow */
            -webkit-box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .game-screen {
            background: linear-gradient(180deg, var(--sonic-dark) 0%, var(--sonic-blue) 100%);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            border: 3px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px;
            text-align: center;
        }

        .name-banner {
            font-size: 3rem;
            text-shadow: 3px 3px 0 #000;
            margin: 0;
            /* Animación compatible con iOS */
            -webkit-animation: bounce 2s infinite;
            animation: bounce 2s infinite;
        }

        @-webkit-keyframes bounce {
            0%, 100% { -webkit-transform: translateY(0); transform: translateY(0); }
            50% { -webkit-transform: translateY(-10px); transform: translateY(-10px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .level-number {
            font-size: 6rem;
            line-height: 1;
            margin: 5px 0;
            background: linear-gradient(to bottom, #fff 50%, #ffd700 51%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 0 #000);
        }

        .btn-confirm {
            background: #FFD700;
            color: #002b80;
            padding: 18px 25px;
            border-radius: 50px;
            font-size: 1.2rem;
            border-bottom: 5px solid #b8860b;
            text-decoration: none;
            display: block;
            width: 100%;
            margin-top: 20px;
            transition: all 0.2s ease;
            /* Evita el color gris al tocar en iOS */
            -webkit-tap-highlight-color: transparent;
        }

        .btn-confirm:active {
            -webkit-transform: scale(0.95);
            transform: scale(0.95);
        }

        .info-card {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 15px;
            width: 100%;
            margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .sonic-head {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="game-background"></div>

    <div class="console-container">
        <div class="game-screen">
            <p style="font-family: 'Press Start 2P'; font-size: 8px; margin-bottom: 12px; letter-spacing: 1px;">AMIR TEAM PRESENTS</p>
            
            <h1 class="name-banner">AMIR</h1>
            
            <div class="level-number">3</div>
            <p style="font-size: 1.2rem; color: #FFD700; letter-spacing: 2px;">NIVEL COMPLETADO</p>

            <svg class="sonic-head" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#0054FF" />
                <path d="M20 35 L5 10 L45 30 Z" fill="#0054FF" />
                <path d="M80 35 L95 10 L55 30 Z" fill="#0054FF" />
                <circle cx="35" cy="45" r="7" fill="white" />
                <circle cx="65" cy="45" r="7" fill="white" />
                <circle cx="35" cy="45" r="3" fill="black" />
                <circle cx="65" cy="45" r="3" fill="black" />
                <path d="M40 70 Q50 80 60 70" stroke="white" stroke-width="3" fill="none" />
            </svg>

            <div class="info-card">
                <p style="margin: 5px 0;">📅 SÁBADO 18 DE ENERO</p>
                <p style="margin: 5px 0;">⏰ 13:00 HORAS</p>
                <p style="font-size: 0.8rem; margin-top: 8px; color: #00d4ff;">📍 CIUDAD PERICO, JUJUY</p>
            </div>

            <!-- Enlace de WhatsApp optimizado para iPhone (iOS) -->
            <a href="https://api.whatsapp.com/send?phone=5493884795130&text=Hola!+Confirmo+mi+asistencia+al+cumple+de+Amir+Nivel+3+🦔" class="btn-confirm">
                CONFIRMAR AQUÍ
            </a>
            
            <a href="https://maps.app.goo.gl/qyx7TryYF1xoyEjd7" style="color: rgba(255,255,255,0.7); font-size: 0.75rem; margin-top: 15px; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.3);">
                VER UBICACIÓN EN MAPA
            </a>
        </div>
    </div>

</body>
</html>
